name: Yocto Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-bridge:
    name: Python yocto-bridge (ruff & pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/yocto-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint & test tools
        run: python -m pip install --upgrade pip pytest pytest-asyncio ruff
      - name: Run Ruff lint
        run: ruff check .
      - name: Run Pytest suite (Modules 1-11)
        run: pytest -v

  frontend:
    name: Shared Protocol & Desktop Frontend (vitest, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @yocto-studio/shared-protocol
        run: pnpm --filter @yocto-studio/shared-protocol build
      - name: Run Vitest unit & i18n parity tests
        run: pnpm --filter @yocto-studio/desktop test
      - name: Typecheck & Vite production build
        run: pnpm --filter @yocto-studio/desktop build

  rust-tauri:
    name: Rust Host Core (clippy & cargo test)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Node dependencies & build frontend assets for Tauri context
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @yocto-studio/shared-protocol build
          pnpm --filter @yocto-studio/desktop build
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            libssl-dev \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Run cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo test suite
        run: cargo test
