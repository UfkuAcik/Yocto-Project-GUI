<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Yocto Studio Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#0F1522"/>
      <stop offset="100%" stop-color="#0B131E"/>
    </linearGradient>
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="320" rx="14" fill="url(#bgGrad)"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="14" fill="url(#glowLeft)"/>
  <rect width="1280" height="320" rx="14" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1278" height="318" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Circuit Traces -->
  <g stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M 0 264 L 220 264 L 248 236 L 420 236"/>
    <path d="M 860 66 L 1010 66 L 1044 100 L 1280 100"/>
    <path d="M 920 250 L 1110 250 L 1140 220 L 1280 220"/>
    <circle cx="420" cy="236" r="3.5" fill="#38BDF8" fill-opacity="0.45"/>
    <circle cx="860" cy="66" r="3.5" fill="#10B981" fill-opacity="0.55"/>
    <circle cx="920" cy="250" r="3.5" fill="#38BDF8" fill-opacity="0.4"/>
  </g>

  <!-- Left Geometric SoC / Layer Emblem -->
  <g transform="translate(88, 72)">
    <rect x="0" y="0" width="176" height="176" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <!-- Pins -->
    <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <line x1="48" y1="-12" x2="48" y2="0"/><line x1="74" y1="-12" x2="74" y2="0"/>
      <line x1="102" y1="-12" x2="102" y2="0"/><line x1="128" y1="-12" x2="128" y2="0"/>
      <line x1="48" y1="176" x2="48" y2="188"/><line x1="74" y1="176" x2="74" y2="188"/>
      <line x1="102" y1="176" x2="102" y2="188"/><line x1="128" y1="176" x2="128" y2="188"/>
      <line x1="-12" y1="48" x2="0" y2="48"/><line x1="-12" y1="88" x2="0" y2="88"/><line x1="-12" y1="128" x2="0" y2="128"/>
      <line x1="176" y1="48" x2="188" y2="48"/><line x1="176" y1="88" x2="188" y2="88"/><line x1="176" y1="128" x2="188" y2="128"/>
    </g>
    <!-- Stacked Yocto Layer Diamonds inside Silicon Die -->
    <polygon points="88,108 140,130 88,152 36,130" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-width="2"/>
    <polygon points="88,76 140,98 88,120 36,98" fill="#38BDF8" fill-opacity="0.22" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="88,44 140,66 88,88 36,66" fill="url(#cobaltGrad)" fill-opacity="0.35" stroke="#7DD3FC" stroke-width="2"/>
    <circle cx="88" cy="66" r="5" fill="#10B981"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(306, 86)">
    <rect x="0" y="0" width="234" height="28" rx="14" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#6EE7B7" letter-spacing="0.8">
      YOCTO 6.0 WRYNOSE &amp; 5.0 SCARTHGAP
    </text>

    <text x="0" y="88" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">
      YOCTO <tspan fill="url(#cobaltGrad)">STUDIO</tspan>
    </text>

    <text x="2" y="124" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="19" font-weight="500" fill="#94A3B8">
      Industrial Embedded Linux IDE · Live tinfoil, Pre-Flight Gate, EU CRA &amp; Target Flashing
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 146)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="92" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="46" y="18" text-anchor="middle" fill="#38BDF8">Tauri v2</text>

      <rect x="102" y="0" width="112" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="158" y="18" text-anchor="middle" fill="#E2E8F0">Rust + React 19</text>

      <rect x="224" y="0" width="128" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="288" y="18" text-anchor="middle" fill="#34D399">Python Bridge</text>

      <rect x="362" y="0" width="166" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="445" y="18" text-anchor="middle" fill="#FBBF24">USB / Eth / UART Flash</text>

      <rect x="538" y="0" width="164" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="620" y="18" text-anchor="middle" fill="#C084FC">WSL2 · Docker · SSH</text>
    </g>
  </g>
</svg>
